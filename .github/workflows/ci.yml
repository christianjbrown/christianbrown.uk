name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JavaScript tests & CSS lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Lint stylesheets
        run: npm run lint:css

  site:
    name: Jekyll build, HTML & accessibility checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `bundler-cache: true` would install in frozen/deployment mode, which
      # requires the CI platform (x86_64-linux) to be listed in Gemfile.lock.
      # The committed lockfile is arm64-darwin only, so install non-frozen and
      # let Bundler resolve the Linux platform (and its precompiled gems).
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Fails on any Liquid, front-matter or SCSS-compile error, so a broken
      # site can never be published green.
      - name: Build site (strict)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Validates the rendered output: internal links, images and scripts.
      # External links are skipped here (flaky/rate-limited); see the weekly
      # external-links workflow if you add one.
      - name: Check rendered HTML
        run: bundle exec htmlproofer ./_site --disable-external --checks Links,Images,Scripts --allow-hash-href

      # Accessibility checks run in "advisory" mode: findings are reported but
      # do not fail the build (the site currently has known WCAG-AA contrast
      # issues in its palette). pa11y exits non-zero on findings, so swallow that
      # into a notice — keeping the step green and free of error annotations.
      # To make this a hard gate, drop the `|| echo ...` fallback.
      - name: Accessibility checks (advisory)
        run: |
          npm run serve:site &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          npm run test:a11y || echo "::notice::pa11y reported accessibility findings — advisory, not failing the build"

  visual:
    name: Visual regression (Percy)
    runs-on: ubuntu-latest

    # The visual-regression gate. Make this a required status check to have it
    # block merges. It fails ONLY on a genuine, unreviewed visual change; every
    # Percy-side problem — no token (fork PRs), network/API error, or an
    # exhausted free-tier screenshot budget — exits 0 with a warning, so an
    # unavailable Percy never blocks a merge. See the gate step for the logic.

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Same non-frozen install rationale as the `site` job above.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Percy renders the captured DOM, so it needs the same production build the
      # site job checks — the snapshot driver serves this _site directory.
      - name: Build site (strict)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Percy visual regression gate
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          # Baseline a PR against the branch it targets (main), not its own head
          # branch — otherwise Percy finds no prior build on the head branch and
          # reports every snapshot as "new". Empty on push events (Percy then
          # auto-detects the current branch), set to e.g. "main" on pull_request.
          PERCY_TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          set -o pipefail

          # No token (e.g. a pull request from a fork): nothing to compare, don't block.
          if [ -z "$PERCY_TOKEN" ]; then
            echo "::notice::PERCY_TOKEN not set — skipping visual regression (not blocking)"
            exit 0
          fi

          # Upload the snapshots. A non-zero here is a Percy/infra problem
          # (network, config, quota) — warn but do not block the merge.
          if ! npm run test:visual | tee percy-run.log; then
            echo "::warning::Percy run failed (network/quota/config) — not blocking the merge"
            exit 0
          fi

          BUILD_ID=$(grep -aoE 'builds/[0-9]+' percy-run.log | head -1 | cut -d/ -f2)
          if [ -z "$BUILD_ID" ]; then
            echo "::warning::No Percy build was created (skipped / over quota) — not blocking"
            exit 0
          fi

          # On push (e.g. to main) the build only refreshes the baseline — there's
          # nothing to gate, so don't fail on "changes". Only pull requests gate.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::notice::push build — baseline refreshed, not gating"
            exit 0
          fi

          # Wait for Percy to finish diffing this exact build. Deliberately NOT
          # --fail-on-changes: despite the name it exits 1 on any diff against
          # the baseline, approved or not. Approval is per-build and every re-run
          # uploads a NEW build, so approving could never satisfy it — the job
          # re-failed on a freshly approved build while Percy's own status on the
          # same build read "No visual changes since last approval".
          set +e
          npx percy build:wait --build "$BUILD_ID" | tee percy-wait.log
          WAIT_CODE=${PIPESTATUS[0]}
          set -e

          # Percy errors (403, timeout, network, quota) also exit non-zero, and
          # those mean "unavailable", not "regression" — so never block on them.
          if [ "$WAIT_CODE" -ne 0 ]; then
            echo "::warning::Percy could not confirm the result (exit $WAIT_CODE) — treating as unavailable, not blocking"
            exit 0
          fi

          # Gate on the build's review state instead. It reads "approved" both
          # when there are no diffs at all and when every diff has been approved —
          # including Percy auto-approving snapshots identical to an already
          # approved build, which is what makes review → re-run actually converge.
          curl -sS --max-time 30 \
            -H "Authorization: Token token=$PERCY_TOKEN" \
            "https://percy.io/api/v1/builds/$BUILD_ID" > percy-build.json || true
          REVIEW_STATE=$(jq -r '.data.attributes["review-state"] // empty' percy-build.json 2>/dev/null || true)

          # Documented values: unreviewed, approved, changes_requested, merged,
          # rejected. Anything unrecognised means we could not read the state —
          # log the payload so it is diagnosable, and fall through to not blocking.
          case "$REVIEW_STATE" in
            approved|merged)
              echo "::notice::Percy build $BUILD_ID review state: $REVIEW_STATE"
              ;;
            unreviewed|changes_requested|rejected)
              echo "::error::Percy build $BUILD_ID review state: $REVIEW_STATE — review/approve the changes at the build URL above, then re-run this job."
              exit 1
              ;;
            *)
              echo "::warning::Could not read Percy review state (got '${REVIEW_STATE:-none}') — treating as unavailable, not blocking"
              head -c 500 percy-build.json || true
              ;;
          esac
          exit 0

  real-device:
    name: Visual regression — real devices (Percy on Automate)
    runs-on: ubuntu-latest

    # Advisory real-device visual snapshots: photographs the pages on real
    # iPhone/iPad Safari and Android Chrome via BrowserStack Automate and uploads
    # them to Percy for review. It never blocks a merge — real-device + Percy on
    # Automate baselining is too flaky to gate on reliably, so the web gate stays
    # the deterministic blocking check. continue-on-error keeps the workflow green
    # even if a device session or Percy hiccups.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Build with the fixture feeds so the devices load fixed, deterministic
      # data (served to them by the mock server over the BrowserStack tunnel).
      - name: Build site with fixture feeds
        run: bundle exec jekyll build --config _config.yml,_config_percy.yml
        env:
          JEKYLL_ENV: production

      - name: Real-device visual snapshots (advisory)
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN_DEVICES }}
          PERCY_TARGET_BRANCH: ${{ github.base_ref }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -o pipefail

          if [ -z "$PERCY_TOKEN" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::notice::Percy/BrowserStack credentials not set — skipping real-device snapshots"
            exit 0
          fi

          # Serve the fixture-built site for the BrowserStack Local tunnel.
          node percy/mock-server.mjs &
          MOCK_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done

          # Capture and upload the real-device snapshots for review. Advisory only —
          # this never fails the build (see the build's diffs in the Percy project).
          npm run test:visual:devices || echo "::warning::Percy on Automate run had issues — advisory, not failing"
          kill $MOCK_PID 2>/dev/null || true
          echo "::notice::Real-device snapshots uploaded to Percy for review (advisory; the web gate is the blocking check)."
          exit 0
