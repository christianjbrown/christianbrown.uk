name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a pull request's run when a newer push supersedes it; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JavaScript tests & CSS lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Lint stylesheets
        run: npm run lint:css

      # The vendored bundles are served from 'self' so the strict script-src CSP
      # holds, which means a drifted or hand-edited copy ships silently. This
      # re-hashes them against config/vendor.json offline, so the gate is on what
      # is committed rather than on what a CDN happens to return today.
      - name: Check vendored assets
        run: npm run vendor:check

  site:
    name: Jekyll build, HTML & accessibility checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `bundler-cache: true` would install in frozen/deployment mode, which
      # requires the CI platform (x86_64-linux) to be listed in Gemfile.lock.
      # The committed lockfile is arm64-darwin only, so install non-frozen and
      # let Bundler resolve the Linux platform (and its precompiled gems).
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Fails on any Liquid, front-matter or SCSS-compile error, so a broken
      # site can never be published green.
      - name: Build site (strict)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Validates the rendered output: internal links, images and scripts.
      # External links are skipped here (flaky/rate-limited); see the weekly
      # external-links workflow if you add one.
      - name: Check rendered HTML
        run: bundle exec htmlproofer ./_site --disable-external --checks Links,Images,Scripts --allow-hash-href

      # Accessibility checks run in "advisory" mode: findings are reported but
      # do not fail the build (the site currently has known WCAG-AA contrast
      # issues in its palette). pa11y exits non-zero on findings, so swallow that
      # into a notice — keeping the step green and free of error annotations.
      # To make this a hard gate, drop the `|| echo ...` fallback.
      - name: Accessibility checks (advisory)
        run: |
          npm run serve:site &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          npm run test:a11y || echo "::notice::pa11y reported accessibility findings — advisory, not failing the build"

  site-unchanged:
    name: Built site unchanged (Dependabot gate)
    runs-on: ubuntu-latest
    # Only a pull request has something to compare against. A job skipped by
    # its `if` still satisfies a required check.
    if: github.event_name == 'pull_request'

    # Builds the site before and after the PR and diffs the output. On a
    # Dependabot PR any difference fails the job, which is what lets those PRs
    # auto-merge: an npm bump cannot touch the output at all (npm is test
    # tooling only, and package*.json are excluded from the build), and a gem
    # bump that changes a single byte of the published site waits for a person.
    # On a human PR the output is meant to change, so the diff is only
    # reported.

    steps:
      # The PR's merge commit, with its first parent (the tip of main it merges
      # into) as the "before". Comparing against that parent rather than the
      # PR's recorded base.sha keeps anything that landed on main since from
      # showing up as part of this PR's diff.
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Check out the target branch alongside
        run: git worktree add --detach ../before HEAD^1

      # Same non-frozen install rationale as the `site` job above.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: false

      # Each side installs its own Gemfile.lock, so a gem bump is compared
      # against the gems it replaces.
      - name: Build the site after the PR
        env:
          JEKYLL_ENV: production
        run: |
          bundle install --jobs 4
          bundle exec jekyll build --strict_front_matter -d "$RUNNER_TEMP/after"

      - name: Build the site before the PR
        working-directory: ../before
        env:
          JEKYLL_ENV: production
        run: |
          bundle install --jobs 4
          bundle exec jekyll build --strict_front_matter -d "$RUNNER_TEMP/before"

      # The layout stamps every page with the build time, the one line that
      # always differs between two builds of the same source.
      - name: Compare the built sites
        env:
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if diff -r -I '^<!-- last generated: .* -->$' "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > site.diff; then
            echo "::notice::The built site is identical before and after this PR"
            exit 0
          fi

          echo "Changed files:"
          diff -rq -I '^<!-- last generated: .* -->$' "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" || true
          echo
          head -c 20000 site.diff

          if [ "$DEPENDABOT_PR" = "true" ]; then
            echo "::error::This Dependabot PR changes the built site, so it cannot auto-merge. Review the diff above and merge by hand if it is right."
            exit 1
          fi
          echo "::notice::This PR changes the built site (expected for a content or code change)"

  visual:
    name: Visual regression (Percy)
    runs-on: ubuntu-latest

    # The visual-regression gate, and a required status check. On a human PR it
    # fails ONLY on a genuine, unreviewed visual change; every Percy-side problem
    # (no token on a fork PR, network/API error, an exhausted free-tier
    # screenshot budget) exits 0 with a warning, so an unavailable Percy never
    # blocks a merge somebody is watching.
    #
    # Dependabot PRs are the exception: they merge themselves (see
    # dependabot-auto-merge.yml), so there "could not check" has to fail rather
    # than pass. They only see Dependabot secrets, which is why PERCY_TOKEN is
    # also stored there. See unavailable() in the gate step.

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Same non-frozen install rationale as the `site` job above.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Percy renders the captured DOM, so it needs the same production build the
      # site job checks — the snapshot driver serves this _site directory.
      - name: Build site (strict)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Percy visual regression gate
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          # Baseline a PR against the branch it targets (main), not its own head
          # branch — otherwise Percy finds no prior build on the head branch and
          # reports every snapshot as "new". Empty on push events (Percy then
          # auto-detects the current branch), set to e.g. "main" on pull_request.
          PERCY_TARGET_BRANCH: ${{ github.base_ref }}
          # Keyed on who opened the PR rather than github.actor, which becomes
          # whoever clicks re-run.
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -o pipefail

          # Percy could not give an answer. A person merging a PR is watching,
          # so warn and pass. A Dependabot PR merges itself, so fail instead:
          # "not checked" must never read as "checked and fine" there.
          unavailable() {
            if [ "$DEPENDABOT_PR" = "true" ]; then
              echo "::error::$1. This Dependabot PR would auto-merge unchecked, so the gate fails. Re-run once Percy is available."
              exit 1
            fi
            echo "::warning::$1 - not blocking the merge"
            exit 0
          }

          # No token (e.g. a pull request from a fork): nothing to compare.
          # Dependabot PRs read PERCY_TOKEN from the Dependabot secrets, not
          # the Actions ones, so it has to be stored in both.
          if [ -z "$PERCY_TOKEN" ]; then
            unavailable "PERCY_TOKEN not set (a Dependabot PR needs it as a Dependabot secret), visual regression skipped"
          fi

          # Upload the snapshots. A non-zero here is a Percy/infra problem
          # (network, config, quota), not a regression.
          if ! npm run test:visual | tee percy-run.log; then
            unavailable "Percy run failed (network/quota/config)"
          fi

          BUILD_ID=$(grep -aoE 'builds/[0-9]+' percy-run.log | head -1 | cut -d/ -f2)
          if [ -z "$BUILD_ID" ]; then
            unavailable "No Percy build was created (skipped or over quota)"
          fi

          # On push (e.g. to main) the build only refreshes the baseline — there's
          # nothing to gate, so don't fail on "changes". Only pull requests gate.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::notice::push build — baseline refreshed, not gating"
            exit 0
          fi

          # Wait for Percy to finish diffing this exact build. Deliberately NOT
          # --fail-on-changes: despite the name it exits 1 on any diff against
          # the baseline, approved or not. Approval is per-build and every re-run
          # uploads a NEW build, so approving could never satisfy it — the job
          # re-failed on a freshly approved build while Percy's own status on the
          # same build read "No visual changes since last approval".
          set +e
          npx percy build:wait --build "$BUILD_ID" | tee percy-wait.log
          WAIT_CODE=${PIPESTATUS[0]}
          set -e

          # Percy errors (403, timeout, network, quota) also exit non-zero, and
          # those mean "unavailable", not "regression".
          if [ "$WAIT_CODE" -ne 0 ]; then
            unavailable "Percy could not confirm the result (exit $WAIT_CODE)"
          fi

          # Gate on the build's review state instead. It reads "approved" both
          # when there are no diffs at all and when every diff has been approved —
          # including Percy auto-approving snapshots identical to an already
          # approved build, which is what makes review → re-run actually converge.
          curl -sS --max-time 30 \
            -H "Authorization: Token token=$PERCY_TOKEN" \
            "https://percy.io/api/v1/builds/$BUILD_ID" > percy-build.json || true
          REVIEW_STATE=$(jq -r '.data.attributes["review-state"] // empty' percy-build.json 2>/dev/null || true)

          # Documented values: unreviewed, approved, changes_requested, merged,
          # rejected. Anything unrecognised means we could not read the state —
          # log the payload so it is diagnosable, and treat Percy as unavailable.
          case "$REVIEW_STATE" in
            approved|merged)
              echo "::notice::Percy build $BUILD_ID review state: $REVIEW_STATE"
              ;;
            unreviewed|changes_requested|rejected)
              echo "::error::Percy build $BUILD_ID review state: $REVIEW_STATE — review/approve the changes at the build URL above, then re-run this job."
              exit 1
              ;;
            *)
              head -c 500 percy-build.json || true
              unavailable "Could not read Percy review state (got '${REVIEW_STATE:-none}')"
              ;;
          esac
          exit 0

  real-device:
    name: Visual regression — real devices (Percy on Automate)
    runs-on: ubuntu-latest

    # Advisory real-device visual snapshots: photographs the pages on real
    # iPhone/iPad Safari and Android Chrome via BrowserStack Automate and uploads
    # them to Percy for review. It never blocks a merge — real-device + Percy on
    # Automate baselining is too flaky to gate on reliably, so the web gate stays
    # the deterministic blocking check. continue-on-error keeps the workflow green
    # even if a device session or Percy hiccups.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: false

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Build with the fixture feeds so the devices load fixed, deterministic
      # data (served to them by the mock server over the BrowserStack tunnel).
      - name: Build site with fixture feeds
        run: bundle exec jekyll build --config _config.yml,_config_percy.yml
        env:
          JEKYLL_ENV: production

      - name: Real-device visual snapshots (advisory)
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN_DEVICES }}
          PERCY_TARGET_BRANCH: ${{ github.base_ref }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -o pipefail

          if [ -z "$PERCY_TOKEN" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::notice::Percy/BrowserStack credentials not set — skipping real-device snapshots"
            exit 0
          fi

          # Serve the fixture-built site for the BrowserStack Local tunnel.
          node percy/mock-server.mjs &
          MOCK_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ >/dev/null && break; sleep 1; done

          # Capture and upload the real-device snapshots for review. Advisory only —
          # this never fails the build (see the build's diffs in the Percy project).
          npm run test:visual:devices || echo "::warning::Percy on Automate run had issues — advisory, not failing"
          kill $MOCK_PID 2>/dev/null || true
          echo "::notice::Real-device snapshots uploaded to Percy for review (advisory; the web gate is the blocking check)."
          exit 0
